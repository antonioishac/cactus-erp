server:
  port: 8081

spring:
  application:
    name: cadastro-base-service

  threads:
    virtual:
      enabled: true

  datasource:
    # preserveInstants/connectionTimeZone: recomendação oficial do Spring Authorization
    # Server para MySQL, garante que os timestamps de token (emissão/expiração) sejam
    # armazenados corretamente (ver oauth2-authorization-schema.sql).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_cadastro?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_cadastro_app}
    password: ${DB_PASSWORD:cactus_cadastro_local}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Não é mais este processo que emite token — quem hospeda o Authorization
          # Server e o JWKS é o seguranca-service. jwk-set-uri (não issuer-uri) de
          # propósito: issuer-uri faz *discovery* e pode falhar o boot se o
          # seguranca-service não estiver de pé ainda; jwk-set-uri busca a chave só na
          # primeira validação de token, sem acoplar ordem de subida dos serviços.
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO
