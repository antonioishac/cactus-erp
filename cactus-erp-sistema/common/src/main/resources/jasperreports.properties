# Força o JasperReports a compilar expressões de relatório ($F{...}/$P{...}/$V{...}) via
# Eclipse JDT (ecj, puro bytecode Java) em vez do compilador default (com.sun.tools.javac),
# que é API interna do JDK bloqueada por módulo forte (module jdk.compiler) sem
# --add-opens explícito. JRJdtCompiler funciona em qualquer JRE sem flag de JVM nenhuma.
net.sf.jasperreports.compiler.class=net.sf.jasperreports.engine.design.JRJdtCompiler

# Sem isso, o export PDF (JRPdfExporter, fonte base-14 não embutida) gera um ToUnicode
# CMap incorreto pra caractere acentuado (ã/ç/é/õ/á/à/ê...) — visível extraindo o texto
# do PDF gerado (pdftotext devolvia "Classifica��o" em vez de "Classificação"),
# achado testando ao vivo com um relatório real em português. Cp1252 cobre toda a
# acentuação do português sem precisar embutir fonte nenhuma (DejaVu via
# jasperreports-fonts fica só como opção pra quando um glifo fora de Cp1252 for
# necessário, ex: símbolo não latino).
net.sf.jasperreports.default.pdf.encoding=Cp1252
net.sf.jasperreports.default.pdf.embedded=false
