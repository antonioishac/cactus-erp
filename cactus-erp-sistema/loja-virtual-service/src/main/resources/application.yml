server:
  port: 8092

spring:
  application:
    name: loja-virtual-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_loja?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_loja_app}
    password: ${DB_PASSWORD:cactus_loja_local}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource Server puro — quem hospeda o Authorization Server e o JWKS é o
          # seguranca-service. jwk-set-uri (não issuer-uri) de propósito: não acopla
          # ordem de subida dos serviços.
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

cactus:
  loja:
    carrinho:
      # Fase 13, sub-fase 4 — TTL de inatividade antes de CarrinhoExpiracaoService liberar
      # a reserva de estoque de um carrinho ABERTO nunca finalizado (aba fechada sem aviso).
      ttl-minutos: ${CACTUS_LOJA_CARRINHO_TTL_MINUTOS:30}
      expiracao-cron: ${CACTUS_LOJA_CARRINHO_EXPIRACAO_CRON:0 */5 * * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO
