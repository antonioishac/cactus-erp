server:
  port: 8093

spring:
  application:
    name: financeiro-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_financeiro?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_financeiro_app}
    password: ${DB_PASSWORD:cactus_financeiro_local}

  rabbitmq:
    # Fase 6-B: caixa/fiado do PDV chegam por aqui (ver config/RabbitConfig). Mesmo broker e
    # vhost do sincronizacao-service/controle-estoque-service.
    host: ${CACTUS_RABBITMQ_HOST:localhost}
    port: ${CACTUS_RABBITMQ_PORT:5672}
    username: ${CACTUS_RABBITMQ_USER:guest}
    password: ${CACTUS_RABBITMQ_PASSWORD:guest}
    virtual-host: ${CACTUS_RABBITMQ_VHOST:cactus}
    listener:
      simple:
        default-requeue-rejected: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource Server puro — quem hospeda o Authorization Server e o JWKS é o
          # seguranca-service. jwk-set-uri (não issuer-uri) de propósito: não acopla
          # ordem de subida dos serviços.
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO

cactus:
  financeiro:
    pdv:
      # O PDV não tem vencimento de fiado: o título nasce vencendo N dias depois da compra.
      fiado-prazo-vencimento-dias: ${CACTUS_FIADO_PRAZO_DIAS:30}
