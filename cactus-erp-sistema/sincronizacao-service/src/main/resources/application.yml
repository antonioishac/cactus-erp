server:
  port: 8087

spring:
  application:
    name: sincronizacao-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_sincronizacao?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_sincronizacao_app}
    password: ${DB_PASSWORD:cactus_sincronizacao_local}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource Server puro — quem hospeda o Authorization Server e o JWKS é o
          # seguranca-service. jwk-set-uri (não issuer-uri) de propósito: não acopla
          # ordem de subida dos serviços.
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      client:
        # Client Credentials pros três serviços que a composição do pull consulta — ver
        # ClientesConfig. Os três apontam pro MESMO client OAuth2 (sincronizacao-service,
        # semeado no OAuth2ClientSeeder), só a registration muda pra Spring cachear o
        # token por destino.
        registration:
          cadastro-base-service:
            provider: seguranca-service
            client-id: sincronizacao-service
            client-secret: ${CACTUS_SERVICE_CLIENT_SECRET:cactus-service-secret-local-dev}
            authorization-grant-type: client_credentials
            scope: internal
          controle-estoque-service:
            provider: seguranca-service
            client-id: sincronizacao-service
            client-secret: ${CACTUS_SERVICE_CLIENT_SECRET:cactus-service-secret-local-dev}
            authorization-grant-type: client_credentials
            scope: internal
          seguranca-service:
            provider: seguranca-service
            client-id: sincronizacao-service
            client-secret: ${CACTUS_SERVICE_CLIENT_SECRET:cactus-service-secret-local-dev}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          seguranca-service:
            token-uri: ${CACTUS_SEGURANCA_TOKEN_URI:http://localhost:8082/oauth2/token}

  # Broker gerenciado fora deste repo, mesmo padrão do cactus-mysql (ver
  # FASE6_SINCRONIZACAO_PDV.md, seção 3.4).
  rabbitmq:
    host: ${CACTUS_RABBITMQ_HOST:localhost}
    port: ${CACTUS_RABBITMQ_PORT:5672}
    username: ${CACTUS_RABBITMQ_USER:guest}
    password: ${CACTUS_RABBITMQ_PASSWORD:guest}
    virtual-host: ${CACTUS_RABBITMQ_VHOST:cactus}

cactus:
  clients:
    cadastro-base-service:
      base-url: ${CACTUS_CADASTRO_BASE_URL:http://localhost:8081}
    controle-estoque-service:
      base-url: ${CACTUS_ESTOQUE_BASE_URL:http://localhost:8083}
    seguranca-service:
      base-url: ${CACTUS_SEGURANCA_BASE_URL:http://localhost:8082}
  sincronizacao:
    # Intervalo do job de relay do outbox (ver OutboxRelayService) — curto de propósito,
    # é o que garante que um POST /sync/lotes recebido com o broker fora do ar publique
    # assim que o broker voltar, sem o PDV precisar reenviar.
    outbox-relay-fixed-delay-ms: ${CACTUS_SINCRONIZACAO_OUTBOX_RELAY_MS:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO
