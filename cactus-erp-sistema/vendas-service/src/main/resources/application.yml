server:
  port: 8088

spring:
  application:
    name: vendas-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_vendas?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_vendas_app}
    password: ${DB_PASSWORD:cactus_vendas_local}

  rabbitmq:
    # Fase 6-B: vendas/devoluções do PDV chegam por aqui (ver config/RabbitConfig).
    host: ${CACTUS_RABBITMQ_HOST:localhost}
    port: ${CACTUS_RABBITMQ_PORT:5672}
    username: ${CACTUS_RABBITMQ_USER:guest}
    password: ${CACTUS_RABBITMQ_PASSWORD:guest}
    virtual-host: ${CACTUS_RABBITMQ_VHOST:cactus}
    listener:
      simple:
        default-requeue-rejected: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource Server puro — quem hospeda o Authorization Server e o JWKS é o
          # seguranca-service. jwk-set-uri (não issuer-uri) de propósito: não acopla
          # ordem de subida dos serviços (busca a chave só na primeira validação).
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
      client:
        # Este serviço TAMBÉM é cliente OAuth2 de outro serviço interno (Client
        # Credentials) — ao confirmar uma venda, chama POST /api/v1/movimentos no
        # controle-estoque-service pra gerar a SAIDA correspondente (mesmo padrão exato
        # de gestao-compras-service -> controle-estoque-service, ver EstoqueClientConfig/
        # EstoqueClient e ServiceOAuth2ClientSupport no common).
        registration:
          controle-estoque-service:
            provider: seguranca-service
            client-id: vendas-service
            client-secret: ${CACTUS_SERVICE_CLIENT_SECRET:cactus-service-secret-local-dev}
            authorization-grant-type: client_credentials
            scope: internal
          financeiro-service:
            provider: seguranca-service
            client-id: vendas-service
            client-secret: ${CACTUS_SERVICE_CLIENT_SECRET:cactus-service-secret-local-dev}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          seguranca-service:
            token-uri: ${CACTUS_SEGURANCA_TOKEN_URI:http://localhost:8082/oauth2/token}

cactus:
  vendas:
    pdv:
      # O PDV manda data/hora local da loja; o ERP guarda Instant.
      fuso-horario: ${CACTUS_FUSO_HORARIO:America/Sao_Paulo}
  clients:
    controle-estoque-service:
      base-url: ${CACTUS_ESTOQUE_BASE_URL:http://localhost:8083}
    financeiro-service:
      base-url: ${CACTUS_FINANCEIRO_BASE_URL:http://localhost:8093}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO
