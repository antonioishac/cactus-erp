server:
  port: 8083

spring:
  application:
    name: controle-estoque-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cactus_estoque?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:cactus_estoque_app}
    password: ${DB_PASSWORD:cactus_estoque_local}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é o dono do schema — Hibernate só valida se o mapeamento das entidades
      # bate com o que as migrations criaram. Nunca ddl-auto=update/create em nenhum ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource Server puro — quem hospeda o Authorization Server e o JWKS é o
          # seguranca-service. jwk-set-uri (não issuer-uri) de propósito: não acopla
          # ordem de subida dos serviços (busca a chave só na primeira validação).
          jwk-set-uri: ${CACTUS_SEGURANCA_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

  # Consumidor de estoque.movimento.q — mensagem publicada pelo sincronizacao-service
  # (Fase 6) quando o PDV empurra ESTOQUE_MOVIMENTO. Broker gerenciado fora deste repo,
  # mesmo padrão do cactus-mysql (ver FASE6_SINCRONIZACAO_PDV.md, seção 3.4).
  rabbitmq:
    host: ${CACTUS_RABBITMQ_HOST:localhost}
    port: ${CACTUS_RABBITMQ_PORT:5672}
    username: ${CACTUS_RABBITMQ_USER:guest}
    password: ${CACTUS_RABBITMQ_PASSWORD:guest}
    virtual-host: ${CACTUS_RABBITMQ_VHOST:cactus}
    listener:
      simple:
        # Retry/backoff fica no RabbitConfig (RetryOperationsInterceptor + RepublishMessageRecoverer),
        # não aqui — acknowledge manual só pelo container aceitar/rejeitar a entrega.
        default-requeue-rejected: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.cactusdigital.erp: INFO
