server.port=8080

# MySql Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cactus_pdv
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.username=root
# Nunca commitar a senha real aqui (achado real: senha em texto puro ficou 6 commits no
# histórico até ser removida via git filter-repo em 2026-09-27) — defina DB_PASSWORD no
# ambiente local (variável de ambiente, ou application-local.properties, já no
# .gitignore) com a senha real do seu MySQL local.
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#images
cactus.pdv.imagens.pasta-base=C:/cactus

# Licenciamento (trava de mensalidade) — ver LICENCIAMENTO.md.
# Deixar retaguarda-url vazio (padrão) faz o LicencaService operar 100% em
# modo local (lê PDV_CONFIGURACAO.PLANO_SITUACAO) — comportamento atual,
# já que o endpoint da retaguarda (Cactus ERP) ainda não existe.
cactus.pdv.licenca.retaguarda-url=
cactus.pdv.licenca.token=
cactus.pdv.licenca.timeout-ms=5000
cactus.pdv.licenca.tolerancia-dias=5

# Fiscal — reprocessamento de vendas com emissão pendente (ver ROADMAP.md fase 6)
cactus.pdv.fiscal.reprocessamento.intervalo-ms=300000

# Logging
logging.level.com.pdv=DEBUG