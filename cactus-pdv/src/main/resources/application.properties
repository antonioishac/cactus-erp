server.port=8080

# MySql Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cactus_pdv
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.username=root
# Nunca commitar a senha real aqui (achado real: senha em texto puro ficou 6 commits no
# histórico até ser removida via git filter-repo em 2026-09-27) — defina DB_PASSWORD no
# ambiente local (variável de ambiente, ou application-local.properties, já no
# .gitignore) com a senha real do seu MySQL local.
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#images
cactus.pdv.imagens.pasta-base=C:/cactus

# Licenciamento (trava de mensalidade) — ver LICENCIAMENTO.md.
# Deixar retaguarda-url vazio (padrão) faz o LicencaService operar 100% em
# modo local (lê PDV_CONFIGURACAO.PLANO_SITUACAO) — comportamento atual,
# já que o endpoint da retaguarda (Cactus ERP) ainda não existe.
cactus.pdv.licenca.retaguarda-url=
cactus.pdv.licenca.token=
cactus.pdv.licenca.timeout-ms=5000
cactus.pdv.licenca.tolerancia-dias=5

# Fiscal — reprocessamento de vendas com emissão pendente (ver ROADMAP.md fase 6)
cactus.pdv.fiscal.reprocessamento.intervalo-ms=300000

# Logging
logging.level.com.pdv=DEBUG

# Sincronização com o ERP (sincronizacao-service) — FASE6_SINCRONIZACAO_PDV.md, seção 16.
# Desligada por padrão: o PDV opera 100% local até a loja ser provisionada no ERP
# (POST /api/v1/sincronizacao/clientes-loja devolve client-id/secret da loja).
cactus.pdv.sync.habilitado=${CACTUS_SYNC_HABILITADO:false}
cactus.pdv.sync.erp-url=${CACTUS_SYNC_ERP_URL:http://localhost:8087}
cactus.pdv.sync.token-url=${CACTUS_SYNC_TOKEN_URL:http://localhost:8082/oauth2/token}
cactus.pdv.sync.loja-id=${CACTUS_SYNC_LOJA_ID:}
cactus.pdv.sync.client-id=${CACTUS_SYNC_CLIENT_ID:}
# Nunca versionar o segredo: só por variável de ambiente.
cactus.pdv.sync.client-secret=${CACTUS_SYNC_CLIENT_SECRET:}
cactus.pdv.sync.intervalo-pull-ms=300000
# Envio PDV -> ERP (fatia 2). a-partir-de: só operações desta data em diante vão para o ERP
# (evita mandar o histórico anterior à implantação). Obrigatório para o envio rodar.
cactus.pdv.sync.envio.a-partir-de=${CACTUS_SYNC_ENVIO_A_PARTIR_DE:}
cactus.pdv.sync.intervalo-envio-ms=60000
cactus.pdv.sync.envio.tamanho-lote=100
# Identifica este PDV no ERP (vazio = hostname). Precisa ser único na loja.
cactus.pdv.sync.dispositivo-id=${CACTUS_SYNC_DISPOSITIVO_ID:}
# Depósito do ERP que recebe os movimentos de estoque desta loja.
cactus.pdv.sync.deposito-id=${CACTUS_SYNC_DEPOSITO_ID:}
# Produto novo vindo do ERP: o ERP não tem subgrupo/tipo/grupo tributário do PDV.
cactus.pdv.sync.produto.subgrupo-padrao-id=${CACTUS_SYNC_SUBGRUPO_PADRAO:}
cactus.pdv.sync.produto.tipo-padrao-id=${CACTUS_SYNC_TIPO_PADRAO:}
cactus.pdv.sync.produto.grupo-tributario-padrao-id=${CACTUS_SYNC_GRUPO_TRIBUTARIO_PADRAO:}
